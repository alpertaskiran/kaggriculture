[project]
name = "agriculture-kaggle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kaggle-environments>=1.18.0",
]

[project.scripts]
agriculture-kaggle = "agriculture_kaggle:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "jupyterlab>=4.5.10",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
